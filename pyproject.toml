[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-explainer-bot"
version = "0.1.0"
description = "AI-powered Git diff reviewer and PR explainer bot for CLI and GitHub Actions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Developer" }
]
dependencies = [
    "pydantic>=2.6.0",
    "google-genai>=0.1.1",
    "groq>=0.9.0",
    "rich>=13.7.0",
    "click>=8.1.7",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
pr-explainer = "cli:main"

[tool.setuptools]
packages = ["src"]
py-modules = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
